name: Build index and deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours, so new arXiv papers show up within hours of posting.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full_harvest:
        description: 'Re-harvest the whole window instead of updating incrementally'
        type: boolean
        default: false

# Let a running deploy finish rather than cancelling it — a half-deployed
# Pages site would serve an index that does not match its manifest.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Incremental refreshes take minutes, but a cold cache (first run, or any
    # change to config/corpus.json) re-harvests the whole window — roughly 75
    # minutes for the core-AI corpus, plus ~12 to build the index.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # First, deliberately. This turns GitHub Pages on if it isn't already
      # (no manual repo-settings step needed) and resolves the site's base
      # path. Running it before the harvest means a Pages misconfiguration
      # fails in seconds rather than after an hour of harvesting.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test

      # The harvested corpus is cached between runs so normal runs only fetch
      # what changed. The key rotates daily so the cache is refreshed rather
      # than growing stale; restore-keys falls back to the most recent one.
      - name: Restore harvested corpus
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: .corpus
          key: arxiv-corpus-${{ hashFiles('config/corpus.json') }}-${{ github.run_id }}
          restore-keys: |
            arxiv-corpus-${{ hashFiles('config/corpus.json') }}-

      # A cold cache means a full harvest from config.historyStart — roughly 75
      # minutes, and longer when arXiv is throttling. The harvester checkpoints
      # after each category, so if this step is cut short by the timeout, simply
      # re-running the workflow resumes rather than starting over. Warm runs
      # finish in seconds.
      - name: Harvest arXiv metadata
        run: node scripts/harvest.mjs ${{ inputs.full_harvest && '--full' || '' }}

      - name: Build search index
        run: npm run build:index

      - name: Build site
        env:
          # Public OAuth client id, not a secret. Absent -> guest-only mode.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Taken from the Pages config itself, so the base path is right for a
          # project site, a user site or a custom domain without being guessed.
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
        run: npm run build

      - name: Report site size
        run: |
          echo "### Deployed site" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/data/* >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./dist/data/manifest.json');console.log('papers:',m.docCount,'terms:',m.stats.termCount)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Pages was already configured at the top of the job.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
