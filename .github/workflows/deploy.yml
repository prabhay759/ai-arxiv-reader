name: Build index and deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours, so new arXiv papers show up within hours of posting.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full_harvest:
        description: 'Re-harvest the whole window instead of updating incrementally'
        type: boolean
        default: false

# Newest run wins. This started as `cancel-in-progress: false` to protect a
# deploy in flight, but that made a single wedged run block the group forever:
# one scheduled run sat queued for over a day, and every refresh behind it was
# evicted and cancelled, so the site silently stopped updating.
#
# Superseding is safe here. The corpus is checkpointed and saved with
# `if: always()` (which covers cancellation), so an interrupted harvest loses
# nothing, and publishing is atomic on Pages' side — there is no half-deployed
# state to protect. A refresh that is already stale being replaced by a newer
# one is exactly the behaviour we want.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Incremental refreshes take minutes, but a cold cache (first run, or any
    # change to config/corpus.json) re-harvests the whole window — roughly 75
    # minutes for the core-AI corpus, plus ~12 to build the index.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # First, deliberately. This turns GitHub Pages on if it isn't already
      # (no manual repo-settings step needed) and resolves the site's base
      # path. Running it before the harvest means a Pages misconfiguration
      # fails in seconds rather than after an hour of harvesting.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          # Self-enables Pages where the token is allowed to. On many accounts
          # it is not ("Resource not accessible by integration"), which is why
          # the next step translates the failure into instructions.
          enablement: true

      # actions/configure-pages fails with a raw API error that does not say
      # what to do about it. Turn it into the one instruction that fixes it.
      - name: Explain how to enable Pages
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Enable it once, then re-run this workflow."
          {
            echo "## GitHub Pages needs enabling"
            echo
            echo "This deploy cannot publish until Pages is turned on for the repository."
            echo "The workflow tried to enable it automatically and was refused"
            echo '(`Resource not accessible by integration`), which means it has to be done'
            echo "by hand once:"
            echo
            echo "1. Go to **Settings → Pages**"
            echo "2. Under **Source**, choose **GitHub Actions**"
            echo "3. Re-run this workflow"
            echo
            echo "After that it never needs doing again — including for the scheduled refreshes."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test

      # The harvested corpus is cached between runs so normal runs only fetch
      # what changed. restore-keys falls back to the most recent cache for the
      # current corpus config; changing that config deliberately misses.
      #
      # Deliberately restore/save rather than actions/cache: the combined
      # action only saves in a post-step that runs on success, so a failed
      # harvest discarded every record it had already fetched. The save below
      # runs with `if: always()`, which is what makes a re-run resume instead
      # of starting from nothing.
      - name: Restore harvested corpus
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: .corpus
          key: arxiv-corpus-${{ hashFiles('config/corpus.json') }}-${{ github.run_id }}
          restore-keys: |
            arxiv-corpus-${{ hashFiles('config/corpus.json') }}-

      # A cold cache means a full harvest from config.historyStart — over an
      # hour, and longer when arXiv is throttling. The harvester streams records
      # to disk and records a watermark after each category, so a run cut short
      # by the timeout resumes where it stopped when re-run. Warm runs finish in
      # seconds.
      #
      # Heap headroom: the harvest itself is streaming, but arXiv responses are
      # parsed a page at a time and the default heap is only ~4 GB.
      - name: Harvest arXiv metadata
        run: node --max-old-space-size=8192 scripts/harvest.mjs ${{ inputs.full_harvest && '--full' || '' }}

      - name: Check for a harvested corpus
        id: corpus-check
        if: always()
        run: |
          if [ -s .corpus/corpus.jsonl ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Corpus on disk: $(wc -l < .corpus/corpus.jsonl) records, $(du -h .corpus/corpus.jsonl | cut -f1)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Always save what was fetched, including after a failed or timed-out
      # harvest — that partial corpus is exactly what lets the next run resume.
      - name: Save harvested corpus
        if: always() && steps.corpus-check.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: .corpus
          key: arxiv-corpus-${{ hashFiles('config/corpus.json') }}-${{ github.run_id }}

      - name: Build search index
        run: npm run build:index

      - name: Build site
        env:
          # Public OAuth client id, not a secret. Absent -> guest-only mode.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Taken from the Pages config itself, so the base path is right for a
          # project site, a user site or a custom domain without being guessed.
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
        run: npm run build

      # A wrong base path does not fail the build — the app loads perfectly and
      # simply 404s every index file, which is how "/ai-arxiv-readerdata/"
      # reached production and looked like a missing corpus for hours.
      - name: Verify the built app points at the real index
        run: |
          set -euo pipefail

          # The index must actually be in the site.
          test -f dist/data/manifest.json || {
            echo "::error::dist/data/manifest.json is missing — the index was not built into the site"
            exit 1
          }

          # Any data path baked into the bundle must be either a bare "data/"
          # (joined with the base at runtime) or properly separated as
          # ".../data/". A base path missing its trailing slash produces
          # "<repo>data/", which is the failure this guards.
          BAD=$(grep -ohaE '"[^"]*data/"' dist/assets/index-*.js \
                | tr -d '"' | grep -Ev '^data/$|/data/$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::malformed data path in the bundle: $BAD"
            echo "This usually means BASE_PATH lost its trailing slash."
            exit 1
          fi
          echo "data paths in bundle are well formed"

      - name: Report site size
        run: |
          echo "### Deployed site" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/data/* >> "$GITHUB_STEP_SUMMARY"
          node -e "const m=require('./dist/data/manifest.json');console.log('papers:',m.docCount,'terms:',m.stats.termCount)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Pages was already configured at the top of the job.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without a commit to the
  # repository, and a refresh that only reads arXiv and publishes to Pages
  # produces no commits at all. Left alone, this workflow switches itself off
  # roughly two months from the last time anyone touched the code, and the
  # site quietly freezes on whatever papers it had that day.
  #
  # So: on scheduled runs, if the repository has gone quiet, push a one-line
  # timestamp. That is a real commit, which resets GitHub's 60-day clock.
  keepalive:
    needs: deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reset the inactivity clock if the repository has gone quiet
        run: |
          set -euo pipefail

          AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit to main: ${AGE_DAYS} days ago."

          # Well inside the 60-day limit, and infrequent enough that the commit
          # log stays readable — at most one stamp every three weeks, and none
          # at all while anyone is actively working on the repository.
          if [ "$AGE_DAYS" -lt 21 ]; then
            echo "Recent enough; the schedule is in no danger. Nothing to do."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/schedule-heartbeat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/schedule-heartbeat

          # [skip ci] matters: without it this push retriggers the workflow on
          # `push: [main]`, and every heartbeat would cost a full deploy.
          git commit -m 'chore: keep the arXiv refresh schedule alive [skip ci]'

          if git push origin main; then
            echo "Pushed a heartbeat commit; the schedule is safe for another 60 days."
          else
            # The only plausible cause is the repository's workflow token being
            # read-only, which is a settings change no workflow can make for
            # itself. Say exactly what to click rather than failing opaquely.
            echo "::warning title=Could not refresh the schedule's inactivity clock::The refresh will stop running once the repository has been inactive for 60 days."
            {
              echo "## The refresh schedule needs a nudge"
              echo
              echo "This job tried to push a heartbeat commit and was refused, which"
              echo "almost always means the workflow token is read-only."
              echo
              echo "1. Go to **Settings → Actions → General**"
              echo "2. Under **Workflow permissions**, choose **Read and write permissions**"
              echo "3. Save"
              echo
              echo "Until then, any commit you push to the repository resets the clock"
              echo "by hand — and GitHub emails you before it disables the schedule."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
